<!DOCTYPE html>
<html lang="en">
  	<head>
    	<meta charset="UTF-8" />
    	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    	<title>Vite App</title>
    	<link href="src/index.css" rel="stylesheet" />
    	<script defer type="module" src="src/main.js"></script>
  	</head>
	
	<body class="min-h-screen gradient-bg">
   
		<div class="container mx-auto p-4 md:p-6 lg:p-8 max-w-7xl">

			<!-- Header -->

			<header class="flex flex-col md:flex-row justify-between items-center mb-12">

				<div class="text-center md:text-left mb-6 md:mb-0">

					<h1 class="text-6xl md:text-7xl font-bold text-white mb-2 tracking-tight">
						<span class="inline-block">💸</span>Splitter
					</h1>

					<p class="text-xl text-purple-100 font-light">Split the expenses with friends effortlessly</p>
				</div>

				<nav class="flex gap-3">

					<button class="btn-hover bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-3 rounded-xl font-semibold shadow-lg">
						Export
					</button>

					<button class="btn-hover bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold shadow-lg">
						Import
					</button>
				</nav>
			</header>

			<!-- FORMS -->

			<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">

				<!-- Add Users Form -->
				<form id="addUserForm" class="glass-effect p-8 rounded-2xl card-shadow">

					<h2 class="text-3xl font-bold mb-6 text-gray-800">Add Users</h2>

					<div class="space-y-4">

						<label for="userInput" class="block text-sm font-medium text-gray-700 mb-2">Name</label>

						<input type="text" id="userInput" class="w-full border-2 border-gray-200 focus:border-blue-500 p-4 rounded-xl text-lg outline-none" placeholder="Enter user name"/>
					
						<button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white px-6 py-4 rounded-xl font-semibold text-lg shadow-lg">Add User</button>
					</div>
				</form>

				<!-- Add Expenses Form -->
				<form id="addExpenseForm" class="glass-effect p-8 rounded-2xl card-shadow">

					<h2 class="text-3xl font-bold mb-6 text-gray-800">Add Expenses</h2>

					<div class="space-y-4">

						<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
							<div>
								<label for="expenseUserInput" class="block text-sm font-medium text-gray-700 mb-2">Who Paid?</label>
								<select id="expenseUserInput" class="w-full border-2 border-gray-200 focus:border-green-500 p-4 rounded-xl text-lg outline-none bg-white">

								</select>
							</div>

							<div>
								<label for="expenseAmountInput" class="block text-sm font-medium text-gray-700 mb-2">Amount (₹)</label>
								<input type="number" id="expenseAmountInput" class="w-full border-2 border-gray-200 focus:border-blue-500 p-4 rounded-xl text-lg outline-none" placeholder="e.g. 100" min="0" step="0.01"/>
							</div>

							<div>
								<label for="expenseReasonInput" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
								<input type="text" id="expenseReasonInput" class="w-full border-2 border-gray-200 focus:border-blue-500 p-4 rounded-xl text-lg outline-none" placeholder="e.g. Petrol"/>
							</div>
						</div>
					
						<button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white px-6 py-4 rounded-xl font-semibold text-lg shadow-lg">Add Expense</button>
					</div>
				</form>
			</div>

			<!-- Expenses Overview -->

			<div id="renderExpense" class="glass-effect p-8 rounded-2xl card-shadow">

				<h2 class="text-3xl font-bold text-gray-800 mb-4">Expense Overview</h2>

				<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

					<!-- All Payments -->
					<div class="lg:col-span-1">

						<h3 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">All Payments</h3>

						<div class="bg-gray-50 border-2 border-gray-200 p-4 rounded-xl h-80 overflow-y-auto scroll-area">

							<ul id="payment-list" class="space-y-2"></ul>
						</div>
					</div>

					<!-- Split Button -->
					<div class="lg:col-span-1 flex items-center justify-center">

						<button id="simplifyBtn" class="btn-hover pulse-glow bg-purple-500 hover:bg-purple-600 text-white px-8 py-6 rounded-2xl font-bold text-xl shadow-2xl">
							Split It!
						</button>
					</div>
					
					<!-- Settlements -->
					<div class="lg:col-span-1">

						<h3 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">Who Owes Whom</h3>

						<div class="bg-gradient-to-br from-amber-50 to-yellow-50 border-2 border-amber-200 p-4 rounded-xl h-80 overflow-y-auto scroll-area">

							<ul id="resultArea" class="space-y-2"></ul>
						</div>
					</div>
				</div>
			</div>

			<!-- Footer -->

			<footer class="text-center mt-12 text-purple-100">

				<p class="text-lg font-light">Made by <b class="font-bold text-amber-400">Sakthi 😎</b> for splitting expenses fairly</p>
			</footer>
		</div>
  	</body>
</html>
